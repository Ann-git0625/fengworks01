const defaults = () => ({view:'home',step:0,answers:[[],[],[],[],[]],notes:['','','','',''],name:'',example:false});

function card(demo=false){const values=demo?['準備展店','各通路形象不一致','招牌字樣、老顧客的熟悉感','','']:state.answers.map((_,i)=>answer(i));const count=values.filter(Boolean).length;return `<article class="snapshot" aria-label="${demo?'示範':'你的'}品牌現況卡"><div class="card-top"><span>YOUR BRAND, AT A GLANCE.</span><span class="card-badge">${demo?'組合預覽':state.view==='result'?'整理完成':`${count} / 5`}</span></div><h2 class="card-title">${esc(!demo&&state.name?state.name:'品牌現況卡')}<small>${demo?'讓改變有方向，讓價值被留下。':'把現在的想法，變成對話的起點。'}</small></h2>${art(count)}<div class="card-rows">${questions.map((q,i)=>`<div class="card-row"><span class="row-label"><i>0${i+1}</i>${q.label}</span><div class="row-value ${values[i]?'':'empty'}">${esc(values[i] || (demo?'等你親手完成':'等待你的選擇'))}${!demo&&state.notes[i]?`<small style="display:block;color:var(--muted);font-size:10px;margin-top:4px;overflow-wrap:anywhere">${esc(state.notes[i])}</small>`:''}${i===1&&values[i]==='各通路形象不一致'?'<div class="touchpoints" aria-label="可盤點的接觸點範例"><span>門市</span><span>包裝</span><span>社群</span></div>':''}</div></div>`).join('')}</div><div class="card-bottom"><strong>fengworks</strong><span>${demo?'A NEW CHAPTER STARTS HERE':state.example?'示範回答 · 可修改':'BRAND SNAPSHOT / 01'}</span></div></article>`}
function home(){return `<section class="landing fade-in"><div class="intro"><div class="eyebrow"><span class="dot"></span>品牌更新，從這裡開始</div><h1>你的品牌，<br>現在最想<em>改變什麼</em>，<br>又最不想失去什麼？</h1><p class="lead">把模糊的更新念頭，整理成清楚的下一步。<br>透過五個問題，親手組成你的「品牌現況卡」。</p><div class="actions"><button class="btn primary" data-action="start">${complete()?'繼續我的現況卡':'開始整理我的品牌'}<span>↗</span></button><button class="text-btn" data-action="example">先看一份範例 →</button></div><div class="micro mini-meta"><span>約 3 分鐘</span><i></i><span>5 個問題</span><i></i><span>不需填寫聯絡資料</span></div></div><div class="preview-stage">${card(true)}<div class="floating-note">每一個選擇，都讓方向更清楚。 ↗</div></div></section><section class="journey" aria-label="體驗流程"><div class="journey-label">一張卡，五個值得聊聊的問題。<small>FROM THOUGHTS TO A CLEARER BRIEF</small></div><ol>${questions.map((q,i)=>`<li><span>0${i+1}</span>${q.label}</li>`).join('')}</ol></section><p class="quiet-note">這是一份討論的起點。你可以隨時返回修改，也可以回答「尚不確定」。</p>`}
function form(){const q=questions[state.step],i=state.step;return `<section class="workspace fade-in"><div class="workspace-top"><button data-action="home">← 回到介紹</button><span>已整理 ${complete()} / 5 個面向</span></div><ol class="steps" aria-label="填寫步驟">${questions.map((x,j)=>`<li><button class="step-button ${j===i?'active':state.answers[j].length?'done':''}" data-step="${j}" ${j>i&&!state.answers.slice(0,j).every(a=>a.length)?'disabled':''} ${j===i?'aria-current="step"':''}><b>${state.answers[j].length&&j!==i?'✓':'0'+(j+1)}</b>${x.label}</button></li>`).join('')}</ol><div class="form-layout"><section class="question"><div class="step-counter">QUESTION 0${i+1} / 05</div><h1 tabindex="-1">${q.title.replace('\n','<br>')}</h1><p class="hint">${q.hint}</p><div class="options" role="group" aria-label="${q.title.replace('\n','')}">${q.options.map((o,k)=>`<button class="option ${q.multi?'multi':''} ${selected(i,o)?'selected':''}" data-option="${k}" aria-pressed="${selected(i,o)}"><span class="selector" aria-hidden="true">${selected(i,o)?'✓':''}</span><span>${o}</span></button>`).join('')}</div><details class="supplement" ${selected(i,'其他')||state.notes[i]?'open':''}><summary>${selected(i,'其他')?'補充你的情況（選填）':'想多說一點？（選填）'}</summary><label for="note">${i===1&&selected(i,'各通路形象不一致')?'例如：哪個門市、包裝或社群接觸點最需要整理？':i===2?'例如：招牌上的手寫字，是創辦人留下的。':'用一兩句話補充就好，也可以留白。'}</label><textarea id="note" maxlength="240" placeholder="寫下你想讓顧問理解的事…">${esc(state.notes[i])}</textarea><span class="count">${state.notes[i].length} / 240</span></details><div class="question-nav"><button class="back" data-action="back">← ${i?'上一題':'回到介紹'}</button><button class="btn primary" data-action="next" ${state.answers[i].length?'':'disabled'}>${i===4?'完成我的現況卡':'下一題'}<span>→</span></button></div><p class="micro" style="margin-top:12px">選項沒有標準答案；「尚不確定」也是有用的起點。</p></section><aside class="preview-panel"><div class="preview-caption"><span>你的現況卡，正在成形</span><b>● 即時預覽</b></div><div id="live-card">${card()}</div><p class="context-note"><span>↳</span>${i===2?'這裡記錄的是你認為重要的品牌資產；消費者是否也認得，仍需後續訪談或辨識測試。':i===1&&selected(i,'各通路形象不一致')?'門市、包裝、社群是可盤點的範例；實際接觸點會依你的品牌確認。':'每回答一題，就多一塊理解品牌的線索。卡片會保留你的選擇，隨時可以回頭調整。'}</p></aside></div></section>`}
const goals={
 '顧客不容易理解品牌價值':{title:'讓品牌價值，更容易被理解',aim:'讓顧客更容易說出品牌提供什麼，以及為什麼值得選擇。',question:'顧客在哪個接觸點最容易誤解品牌？他們現在如何形容你？',next:'蒐集官網、產品介紹與業務說法，對照顧客的實際回饋，先找出訊息落差，再整理核心價值與溝通順序。'},

function recommendation(){const g={...goals[state.answers[1][0]||'尚不確定']};if(selected(0,'準備展店')&&selected(1,'各通路形象不一致'))g.title='展店前的品牌一致性整理';if(selected(0,'接班轉型'))g.question+=' 接班前後，哪些經營價值需要先取得共識？';if(selected(0,'進入新市場'))g.next+=' 同時檢查新市場的語言、通路與文化情境是否不同。';const assets=state.answers[2].filter(x=>!['尚不確定','其他'].includes(x));g.preserve=assets.length?`你希望延續${assets.join('、')}，並把它們列為更新前優先確認的保留條件。`:selected(2,'其他')?`你有另外想保留的價值${state.notes[2]?'：「'+state.notes[2]+'」':'，可在後續討論中補充具體內容'}。`:'目前尚未確認要保留的資產。可先整理品牌歷史與既有素材，再與團隊及顧客確認。';g.concern=concerns[state.answers[3][0]||'尚不確定'];return g;}
const caseData=[

function result(){const g=recommendation(),next=nextCopy();return `<section class="result fade-in"><div class="result-intro"><div><div class="eyebrow"><span class="dot"></span>${state.example?'烘焙品牌・示範結果':'你的想法，已經有了輪廓'}</div><h1>品牌的下一步，從這張卡開始。</h1><p>這是一份能帶去討論的需求摘要，也可以再回頭修改。</p></div><div class="result-actions"><button class="btn secondary" data-action="edit">← 修改回答</button><button class="btn primary" data-action="download">下載摘要 ↓</button><button class="btn secondary" data-action="copy">複製摘要</button><button class="btn secondary" data-action="print">列印／PDF</button></div></div><div class="result-layout"><article class="summary"><div class="summary-heading">BRAND BRIEF / 需求摘要</div><h2 class="summary-title">${g.title}</h2><div class="summary-block"><h3>01 — 你想推進的事</h3><p>${g.aim}</p></div><div class="summary-block"><h3>02 — 你希望保留的價值</h3><p>${esc(g.preserve)}</p><small>這是你認為重要的資產，尚未經消費者訪談或辨識測試驗證。</small></div><div class="summary-block highlight"><h3>03 — 建議先釐清的問題</h3><p>${g.question}</p></div><div class="summary-block"><h3>04 — 可先採取的下一步</h3><p>${g.next}</p><small>回應你的顧慮：${g.concern}</small></div><p class="result-note">摘要示範：依選項組合產生，尚未串接 AI。文字補充保留於卡片中，供後續人工討論；本卡不作為品牌診斷或評分。</p></article><aside class="preview-panel"><div class="preview-caption"><span>你的品牌現況卡</span><b>✓ 5 個面向已整理</b></div><div id="live-card">${card()}</div><label class="name-field" for="brand-name">為卡片加上名稱<span class="micro">（選填）</span><input id="brand-name" class="name-input" maxlength="24" value="${esc(state.name)}" placeholder="例如：我的烘焙品牌"></label><p class="context-note"><span>↳</span>回答暫存在此分頁，重新整理後可繼續。此原型不會將回答或聯絡資料送至汎羽。</p></aside></div><section class="cases" id="cases"><div class="section-heading"><h2>從相近的課題，看看別人的下一步。</h2><span>依回答排序的閱讀建議<br>連結至汎羽官方案例</span></div><div class="case-grid">${sortedCases().map((c,i)=>`<a class="case-link" href="${c.url}" target="_blank" rel="noopener"><div class="case-visual ${c.key}" aria-hidden="true"><span class="case-type">READING / 0${i+1}</span><span class="case-initial">$ function openModal(html){$('#modal-content').innerHTML=html;$('#modal').showModal();}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('visible');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3000);}
function summaryText(){const g=recommendation();return `汎羽｜品牌現況卡${state.example?'（示範回答）':''}\n${state.name?'品牌：'+state.name+'\n':''}整理方向：${g.title}\n\n${questions.map((q,i)=>q.label+'：'+answer(i)+(state.notes[i]?'\n補充：'+state.notes[i]:'')).join('\n\n')}\n\n你想推進的事\n${g.aim}\n\n你希望保留的價值\n${g.preserve}\n（保留資產尚未經消費者訪談或辨識測試驗證。）\n\n建議先釐清的問題\n${g.question}\n\n可先採取的下一步\n${g.next}\n回應顧慮：${g.concern}\n\n閱讀建議\n${sortedCases().map(c=>c.title+'｜'+c.url).join('\n')}\n\n互動提案原型：摘要依選項組合產生，尚未串接 AI；文字補充供人工討論。本卡不作為品牌診斷或評分，資料尚未送出。\n汎羽官方聯絡頁：https://www.fengworks.com/contact/`;}
async function copy(){try{await navigator.clipboard.writeText(summaryText());toast('需求摘要已複製，可以帶回團隊討論。');}catch{if($('#modal').open)$('#modal').close();openModal(`<h2 id="modal-title">複製你的需求摘要</h2><p>瀏覽器未允許直接複製，請選取下方文字手動複製。</p><textarea readonly aria-label="需求摘要">${esc(summaryText())}</textarea>`);$('#modal textarea').select();}}
function loadExample(){state={...defaults(),view:'result',answers:[['準備展店'],['各通路形象不一致'],['招牌字樣','老顧客的熟悉感'],['老顧客認不出來'],['帶回公司討論']],name:'既有烘焙品牌',example:true};render(true);}
function selectOption(k){const i=state.step,q=questions[i],v=q.options[k];if(q.multi){if(v==='尚不確定')state.answers[i]=selected(i,v)?[]:[v];else {state.answers[i]=state.answers[i].filter(x=>x!=='尚不確定');state.answers[i]=selected(i,v)?state.answers[i].filter(x=>x!==v):[...state.answers[i],v];}}else state.answers[i]=[v];render();const b=$(`[data-option="${k}"]`);b?.focus({preventScroll:true});}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;if(b.classList.contains('wordmark')){e.preventDefault();state.view='home';render(true);return;}if(b.hasAttribute('data-option')){selectOption(Number(b.dataset.option));return;}if(b.hasAttribute('data-step')){state.step=Number(b.dataset.step);render(true);return;}switch(b.dataset.action){
 case 'start':state.view='form';state.step=Math.max(0,state.answers.findIndex(a=>!a.length));render(true);break;
 case 'home':state.view='home';render(true);break;
 case 'back':if(state.step>0)state.step--;else state.view='home';render(true);break;
 case 'next':if(!state.answers[state.step].length)return;if(state.step===4)state.view='result';else state.step++;render(true);break;
 case 'edit':state.view='form';state.step=0;render(true);break;
 case 'example':if(complete()&&!state.example){openModal('<h2 id="modal-title">切換到示範回答？</h2><p>目前這個分頁的回答會被範例取代。若想保留，可以先繼續完成並下載摘要。</p><button class="btn primary" data-action="load-example">切換到範例</button>');}else loadExample();break;
 case 'load-example':$('#modal').close();loadExample();break;
 case 'close':$('#modal').close();break;
 case 'copy':await copy();break;
 case 'download':{const blob=new Blob(['\ufeff'+summaryText()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='汎羽-品牌現況卡.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已下載品牌現況卡與完整需求摘要。');break;}
 case 'print':window.print();break;
 case 'restart':openModal('<h2 id="modal-title">開始一張新的現況卡？</h2><p>這會清除目前分頁內的回答。你可以先下載摘要，再開始整理下一個品牌。</p><div class="modal-links"><button class="btn secondary" data-action="close">保留目前回答</button><button class="btn primary" data-action="reset">開始新卡片</button></div>');break;
 case 'reset':$('#modal').close();state=defaults();state.view='form';render(true);break;
 case 'consult':openModal(`<div class="eyebrow" style="margin-bottom:14px">LET’S TALK ABOUT YOUR BRAND</div><h2 id="modal-title">讓第一次對話，更有方向。</h2><p>先確認你的需求摘要，再選擇聯絡方式。此頁不會自動送出資料，也尚未完成預約。</p><h3>準備帶進討論的內容</h3><p>${esc(answer(0))} ／ ${esc(answer(1))}<br>希望先：${esc(answer(4))}</p><div class="modal-links"><button class="btn secondary" data-action="copy">複製完整摘要</button><a class="btn primary" href="https://www.fengworks.com/contact/" target="_blank" rel="noopener">前往官方聯絡頁 ↗</a></div><p style="font-size:11px;margin-top:19px">可將摘要貼入官網表單，或寄至 <a href="mailto:info@fengworks.com">info@fengworks.com</a>。是否送出由你決定。</p>`);break;
 case 'about':openModal(`<div class="eyebrow" style="margin-bottom:14px">STAGE 01 / INTERACTIVE PROPOSAL</div><h2 id="modal-title">先理解現況，再討論改變。</h2><p>品牌現況卡把品牌更新的念頭，整理成一份能與團隊或顧問對話的需求摘要。你不必先認定品牌有問題，也不必預設一定要換 Logo。</p><h3>這個原型可以做什麼？</h3><p>回答五個問題、逐步組成卡片、返回修改、閱讀對應建議與官方案例，並下載或複製摘要。諮詢入口會前往汎羽官方聯絡頁。</p><h3>摘要與資料如何處理？</h3><p>本版以選項規則示範未來 AI 輔助摘要的體驗，尚未串接 AI、CRM 或表單後台。補充文字原樣保留，不宣稱已經過 AI 理解。回答僅暫存於此分頁的瀏覽器工作階段，不會自動送至汎羽。</p><h3>下一階段的提案重點</h3><p>串接 AI 前，先驗證題目與摘要是否有助於對話；正式蒐集需求時，再加入清楚的同意與資料使用說明。保留資產仍需透過訪談或辨識測試確認。</p><h3>設計與內容參考</h3><p>逐步呈現選項與選填補充欄位，參考 <a href="https://www.nngroup.com/articles/4-principles-reduce-cognitive-load/" target="_blank" rel="noopener">NN/g：降低表單認知負荷</a>。案例與聯絡資訊來自 <a href="https://www.fengworks.com/works/" target="_blank" rel="noopener">汎羽官方網站</a>；本站為互動提案原型。</p>`);break;
}});
document.addEventListener('input',e=>{if(e.target.id==='note'){state.notes[state.step]=e.target.value.slice(0,240);$('.count').textContent=state.notes[state.step].length+' / 240';$('#live-card').innerHTML=card();save();}if(e.target.id==='brand-name'){state.name=e.target.value.slice(0,24);$('#live-card').innerHTML=card();save();}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close();}});
render();
</script></body>
</html>
